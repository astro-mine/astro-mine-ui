# Dependency update policy for astro-mine-ui.
#
# Until now this repository had none, and relied on the org-wide *security*-update default alone.
# That default is what surfaced the pinned-postcss problem (#25) — but a policy that only speaks
# when there is a CVE is a policy that lets ordinary version drift accumulate silently, which is how
# a repository ends up three action majors behind without anyone deciding to be (#26).
#
# Grouping is the point of this file as much as the schedule is. Ungrouped, a workspace this size
# opens a PR per dependency per week, and a review queue nobody can keep up with is indistinguishable
# from no updates at all — the same failure mode as a permanently red updater.

version: 2

updates:
  # ---- npm / pnpm -----------------------------------------------------------
  # `directories` covers the workspace root and every member, so a dependency declared in
  # apps/console or one of the packages is updated where it is declared rather than ignored.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Everything non-breaking in one PR. CI is the gate: layering, format, typecheck, lint, build
      # and the two static-export assertions all run on it, so a green group PR has been checked
      # more thoroughly than a human reading a version number would manage.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Majors stay separate and one per PR. Each one is a decision — Next, React and MUI majors
      # move the whole front end, and the last three majors in this repo each carried a behaviour
      # change worth reading the notes for.
      react-and-next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - major
      mui:
        patterns:
          - "@mui/*"
        update-types:
          - major

    # `@types/node`'s major is a CONSEQUENCE of `.nvmrc`, never a proposal of its own.
    #
    # These types describe the Node the workspace builds on. Letting them move independently means
    # `tsc` accepting a call to an API the runtime does not have — it compiles, every test passes
    # because nothing calls it yet, and it fails at runtime for whoever writes the first one.
    #
    # That is not hypothetical: #30 bumped these from 22 to 26 while `.nvmrc` said 22, went green on
    # all eight lanes, and was merged. The lanes were right — nothing was broken *yet*. What was
    # wrong is that a dependency update had made a runtime-support decision by proxy.
    #
    # So majors are ignored here and the version is moved by hand, in the same commit that moves
    # `.nvmrc` and `engines.node`. Minors and patches still flow normally.
    #
    # LIFT THIS when the runtime moves: the three must be changed together, and the reason to change
    # them is Node's own LTS schedule, not a pull request.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # ---- GitHub Actions -------------------------------------------------------
  # The lane that would have raised #26 on its own. Actions are grouped without exception: they are
  # few, and a bump is either safe or immediately red in the same run that proposes it.
  #
  # **The workflow floats major tags on purpose** — `actions/checkout@v7`,
  # `pnpm/action-setup@v6`, and so on — so a patch release arrives without a pull request and this
  # ecosystem only speaks when a *major* needs a human decision.
  #
  # Dependabot will occasionally propose narrowing one of those to an exact patch (`@v6` → `@v6.0.9`,
  # PR #39). **Close those.** Taken alone such a PR buys nothing: `@v6` is already running 6.0.9. It
  # would leave one action of eight pinned differently from the rest, which is worse than either
  # consistent choice, and it commits the repository to a pull request per patch release for that one
  # action forever.
  #
  # The alternative worth knowing about, if this is ever revisited: pin **every** action to a commit
  # SHA rather than a tag. That is the real supply-chain position — a tag is mutable and can be
  # re-pointed by whoever controls the action's repository, a SHA cannot — and it is what a hardened
  # workflow does. It is a deliberate policy change with real churn, not something to arrive at one
  # merged Dependabot PR at a time.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
