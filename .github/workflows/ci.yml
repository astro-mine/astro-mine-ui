name: CI

# The floor that must never be red. It runs on pull requests, not only on pushes to main — a gate
# that first speaks after a merge is a gate that speaks too late.
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default (org security baseline).
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ONE JOB PER LANE (ui#8).
#
# This was a single `build` job with twenty-one steps. It was correct and it read badly: a red
# check said "build", and finding out whether that meant a type error, a contract drift or a
# colour-contrast regression meant opening the log. `ui#8`'s acceptance criterion is that "the lanes
# run on pull requests and **each names itself in the checks list**".
#
# The cost is honest and worth stating: each job installs the workspace again, about a minute, and
# they run in parallel so the wall clock is the slowest lane rather than the sum. What is NOT
# duplicated is the build — `build` runs it once and uploads the export, and the three lanes that
# need one download it. Rebuilding three times would have traded a legible failure for four minutes.

jobs:
  # ── the fast, static lanes ────────────────────────────────────────────────────────────────────
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The one rule this workspace exists to hold (ARCHITECTURE.md). First, because it is fast and
      # because a layering break makes every later failure harder to read.
      - name: Layering
        run: pnpm check:layering
      - name: No hand-written API types
        run: pnpm check:api-types

      # ...and the proof that each gate above can actually fail. A gate nothing has been observed to
      # reject is a gate nobody should trust.
      - name: Gate self-tests (layering, api-types, vocabularies, drift, bundle)
        run: |
          pnpm check:layering:test
          pnpm check:api-types:test
          pnpm check:vocabularies:test
          pnpm check:api-drift:test
          pnpm check:bundle:test

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  # ── the cross-repository contracts ────────────────────────────────────────────────────────────
  #
  # Both read a private sibling repository with CORE_REPO_TOKEN, and both FAIL rather than skip when
  # the credential is absent: a compatibility check that goes quiet when its token lapses has stopped
  # existing, and it goes quiet on exactly the day nobody is looking.
  contract:
    name: Contract (API + platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The committed client is what the vendored document generates, and the vendored document is
      # what astro-mine-api serves at HEAD.
      - name: The client is in step with the API
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:api-drift

      # View vendors Core's units schema and conformance vectors; the inspector registry generates
      # Core's PluginKind and Hub's container kinds. Both go stale silently without a guard.
      - name: Vendored Core schemas are in step with the platform
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:core-schema
      - name: Core and Hub vocabularies are in step with the platform
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:vocabularies

  # ── the suite, with the floor ─────────────────────────────────────────────────────────────────
  unit:
    name: Unit & component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One Vitest over five projects, so the coverage floor is measured across the workspace rather
      # than five times independently. `--coverage` enforces the thresholds in vitest.config.ts.
      - name: Tests and coverage floor
        run: pnpm test:coverage

  # ── the design gates ──────────────────────────────────────────────────────────────────────────
  #
  # Their own lane rather than steps inside `unit`, because a failure here reads as what it is: a
  # contrast or colour-vision regression, not "a test broke". Each carries its own companion proving
  # it rejects a deliberately-bad pair.
  design:
    name: Contrast & colour vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contrast (WCAG 2.1 AA, light and dark)
        run: pnpm check:contrast
      - name: Colour-vision separation (categorical palette, light and dark)
        run: pnpm check:palette

  # ── the build, and the properties only the emitted bytes can show ─────────────────────────────
  build:
    name: Build & emitted bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (packages, then the static export)
        run: pnpm build

      # `output: 'export'` is the whole deployment story, so assert the export happened rather than
      # trusting a zero exit code.
      - name: The build produced a static export
        run: |
          test -f apps/console/out/index.html \
            || { echo "::error::next build produced no static export at apps/console/out/index.html"; exit 1; }
          echo "Static export present: $(find apps/console/out -type f | wc -l) files."

      # The first paint must arrive styled. AppRouterCacheProvider flushes Emotion's styles into the
      # prerendered HTML; without it the export ships unstyled markup and flashes on hydrate. That is
      # invisible to a type-check and to a passing build.
      - name: The static export carries its styles (no flash on first paint)
        run: |
          grep -q 'data-emotion=' apps/console/out/index.html \
            || { echo "::error::apps/console/out/index.html carries no Emotion styles — the MUI cache provider is not wired, and the export will flash unstyled on first paint"; exit 1; }
          echo "Emotion styles are inlined in the prerendered HTML."

      # The pre-paint script and the theme's CSS must key off the SAME attribute. They are set in
      # different files and neither can see the other; everything compiles, builds and tests green,
      # and dark mode is dead in a browser. jsdom cannot stand in for it — it does not populate the
      # inline script's body — so the emitted bytes are where it is checked.
      - name: The colour scheme applies before first paint (script and CSS agree)
        run: |
          grep -q 'data-mui-color-scheme' apps/console/out/index.html \
            || { echo "::error::apps/console/out/index.html carries no colour-scheme init script — the export will paint light for everyone and flip on hydrate"; exit 1; }
          grep -q '\[data-mui-color-scheme="dark"\]' apps/console/out/index.html \
            || { echo "::error::the dark colour scheme's CSS is not keyed to data-mui-color-scheme — theme.ts's colorSchemeSelector and InitColorSchemeScript's attribute disagree, and dark mode will never apply"; exit 1; }
          echo "The init script and the dark scheme's CSS agree on data-mui-color-scheme."

      # `useSearchParams` called too high in a page empties that page out of the export — it ships
      # with the shell and nothing else, and every other lane stays green. A page's `<h1>` is the
      # cheapest thing that proves the page itself rendered.
      - name: Every route prerenders its own content
        run: |
          empty=""
          while IFS= read -r page; do
            grep -qE '<h1[^>]*>[^<]' "$page" || empty="$empty $page"
          done < <(find apps/console/out -name index.html)
          if [ -n "$empty" ]; then
            echo "::error::these routes exported no <h1>, so they prerender nothing and paint blank until hydration — a component is almost certainly calling useSearchParams above the content it needs it for (see shell/searchParams.ts):$empty"
            exit 1
          fi
          echo "All $(find apps/console/out -name index.html | wc -l) routes prerender their own content."

      # Cesium must be served by the deployment (it fetches workers and web assembly from
      # CESIUM_BASE_URL, not through the bundler) and must be reachable only at runtime.
      - name: Cesium is served locally and loaded only on demand
        run: |
          for dir in Assets ThirdParty Widgets Workers; do
            test -d "apps/console/out/cesium/$dir" \
              || { echo "::error::apps/console/out/cesium/$dir is missing — Cesium's runtime assets were not staged into the export, and the globe will fail to load with no build error to show for it"; exit 1; }
          done
          chunks=apps/console/out/_next/static/chunks
          biggest=$(ls -S "$chunks" | head -1)
          grep -q 'CESIUM_BASE_URL' "$chunks/$biggest" \
            || { echo "::error::the largest chunk is not Cesium's — this assertion has lost its subject and needs rewriting"; exit 1; }
          if grep -rl "$biggest" apps/console/out --include='*.html' >/dev/null 2>&1; then
            echo "::error::the Cesium chunk ($biggest) is preloaded by a prerendered route — something imports @astro-mine/view statically instead of through next/dynamic with ssr:false, and every route now pays 4 MB for a globe it does not draw"
            exit 1
          fi
          echo "Cesium staged locally ($(du -sh apps/console/out/cesium | cut -f1)); its chunk is runtime-only."

      # ui#13: "The replay chunk is **not** in the leaderboard route's bundle, asserted against the
      # build output." The step above proves no *prerendered* route preloads Cesium; this one names
      # the route the criterion is about, because that is the one with a person behind it — a
      # student who opened a leaderboard to look at a number must not download a globe and an MCAP
      # reader to do it.
      #
      # Asserted on the referenced scripts rather than on a chunk name, because chunk names are
      # content hashes and change every build.
      # ui#17 asks the same of the candidate-inspection pane. Both heavy panes go through
      # `next/dynamic` and both are checked the same way, so the route list below covers the two of
      # them: `/design/study` mounts the inspection pane and `/bench/submission` mounts the replay,
      # and neither chunk may reach a route that draws no globe.
      - name: The replay viewer is absent from the routes that do not draw one
        run: |
          for route in bench/leaderboard registry compute design design/new help; do
            page="apps/console/out/$route/index.html"
            test -f "$page" || { echo "::error::$page is missing — this assertion has lost its subject"; exit 1; }
            for script in $(grep -o '/_next/static/[^"'"'"']*\.js' "$page" | sort -u); do
              file="apps/console/out${script}"
              test -f "$file" || continue
              if grep -q 'CESIUM_BASE_URL\|@mcap/core\|McapIndexedReader' "$file"; then
                echo "::error::/$route references $script, which carries a 3D viewer. Something imports @astro-mine/view, ./ReplayScene or ./InspectionScene statically instead of through next/dynamic — see components/bench/ReplayPane.tsx and components/design/InspectionPane.tsx."
                exit 1
              fi
            done
          done
          echo "The 3D viewers are loaded on demand only; no route that draws no globe references one."

      # Built once, used by three lanes. `include-hidden-files` matters: the export has none today,
      # but the default silently drops dotfiles and a missing one would surface as a mystery 404.
      #
      # The artifact actions are the one pair here that is genuinely exercised rather than merely
      # present — `bundle`, `e2e` and `a11y` all download what this uploads, so a major bump that
      # broke the handoff would take three lanes with it rather than passing quietly.
      - name: Upload the export
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: apps/console/out
          include-hidden-files: true
          retention-days: 1

  # ── the lanes that need a built export ────────────────────────────────────────────────────────
  bundle:
    name: Bundle budget
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: static-export
          path: apps/console/out
      - name: Per-route JavaScript is within budget
        run: pnpm check:bundle

  e2e:
    name: E2E (built export)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: static-export
          path: apps/console/out

      # `--with-deps` is what this workspace's own development environment cannot have: Chromium
      # needs system libraries (libasound2 among them) that a WSL checkout does not ship, which is
      # why a red browser lane *there* is environmental and why this job is the arbiter.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Persona smoke journeys
        run: pnpm e2e e2e/smoke.spec.ts

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  a11y:
    name: Accessibility (routes, both schemes)
    needs: build
    runs-on: ubuntu-latest
    # NOT YET A GATE, and this is the one place that is written down as a workflow setting rather
    # than as prose. `ui#8` ships the lane runnable; **Wave 30 removes this line** once there are
    # real pages behind the routes and any finding it reports has been fixed rather than baselined.
    # Until then it reports, in colour, on every pull request — which is how the findings get known
    # before they are enforced.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: static-export
          path: apps/console/out
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # A real browser, so `color-contrast` can actually run — the rule the jsdom lane must disable
      # because it samples pixels and jsdom has no paint engine.
      - name: axe over every route, light and dark
        run: pnpm e2e:a11y
