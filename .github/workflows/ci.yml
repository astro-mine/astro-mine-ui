name: CI

# The floor that must never be red. It runs on pull requests, not only on pushes to main — a gate
# that first speaks after a merge is a gate that speaks too late.
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default (org security baseline).
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # All three actions run on the Node 24 action runtime. The v4 majors targeted Node 20, which
      # the runner already refused to honour — it forced them onto 24 and annotated every run,
      # including the green ones. Bumping is what removes the warning before it becomes an error.
      - uses: actions/checkout@v7

      # v6 is the first major that declares support for pnpm v11, which is what this workspace
      # pins (pnpm@11.10.0, from package.json "packageManager"). The version is NOT repeated here:
      # specifying it in both places is an error, not a belt-and-braces.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # The Node version comes from .nvmrc, and the floor is pnpm's, not ours: pnpm 11.10.0 declares
      # engines.node >= 22.13 and crashes on Node 20 with "No such built-in module: node:sqlite".
      #
      # `cache: pnpm` is load-bearing and must stay explicit. setup-node v6 limited *automatic*
      # caching to npm — with no `cache` input, pnpm and yarn are no longer cached at all. Naming it
      # is the supported way to keep the pnpm store cached, and dropping this line would not fail
      # the build; it would just make every run minutes slower, silently.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No registry credential: every @astro-mine dependency in this workspace is `workspace:*` and
      # resolves locally. The .npmrc scope mapping exists for publishing and for consumers, not for
      # this install. If a step here ever needs a token, that is a design change worth noticing.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one rule this workspace exists to hold (ARCHITECTURE.md). First, because it is fast and
      # because a layering break makes every later failure harder to read.
      - name: Layering check
        run: pnpm check:layering

      # ...and the proof that the check above can actually fail. A gate nothing has been observed to
      # reject is a gate nobody should trust.
      - name: Layering check — its own failure modes
        run: pnpm check:layering:test

      # The property the generated client exists to establish: nobody has hand-copied the API's
      # shapes back in, and no page opens its own request. Cheap, static, and the thing that decays.
      - name: No hand-written API request or response types
        run: pnpm check:api-types

      - name: No hand-written API types — its own failure modes
        run: pnpm check:api-types:test

      # THE CONTRACT LANE (ui#2). Two assertions in one script: the committed client is what the
      # vendored document generates, and the vendored document is what astro-mine-api serves at
      # HEAD. The second needs read access to that private repository — CORE_REPO_TOKEN is the
      # org's private-repo read credential, the same secret name the API's own CI uses for the
      # platform. Here it reads astro-mine-api rather than the platform; one name, one rotation.
      #
      # If the token is absent or expired this lane FAILS and says so in those words. It does not
      # skip: a contract check that goes quiet when its credential lapses has stopped existing, and
      # it would go quiet on exactly the day nobody is looking.
      - name: Contract — the client is in step with the API
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:api-drift

      # THE VENDORED-SCHEMA LANE (ui#6). `@astro-mine/view` is TypeScript and cannot import
      # `astro_mine.core`, so it vendors Core's units schema and conformance vectors and generates
      # `frames/generated/units.ts` from them. Vendored bytes with no guard are drift with extra
      # steps — the copy was three Core tags stale when the guard was first written.
      #
      # Reads astro-mine-platform with CORE_REPO_TOKEN, the same credential the contract lane uses
      # for astro-mine-api. Like that lane, it FAILS rather than skips when the token is absent: a
      # compatibility check that goes quiet when its credential lapses has stopped existing.
      - name: Vendored Core schemas are in step with the platform
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:core-schema

      # THE CONTRAST LANE (ui#3). Every colour pairing the theme declares, measured against WCAG 2.1
      # in BOTH schemes — and, in the same file's companion, proof that the check rejects a
      # deliberately-bad pair. It runs as its own step rather than only inside `pnpm test` so a
      # failure reads as what it is: a contrast regression, not "a test broke".
      #
      # "Where a package ships design tokens, the properties asserted about them are checked, not
      # claimed" (conventions.md §11). An accessibility claim nobody runs is one that quietly stops
      # being true.
      - name: Contrast (WCAG 2.1 AA, light and dark)
        run: pnpm check:contrast

      # THE COLOUR-VISION LANE (ui#4). The contrast lane asks whether a mark can be seen against the
      # page; this asks whether two marks can be told apart — every pair of the categorical ramp, in
      # both schemes, through normal vision and all three dichromacies. Neither implies the other:
      # five colours can each clear 3:1 against white and be one colour to a reader with a
      # red-green deficiency, which is roughly one man in twelve and a failure a chart legend cannot
      # survive. Its own step, and its own companion proving the check rejects a bad pair.
      - name: Colour-vision separation (categorical palette, light and dark)
        run: pnpm check:palette

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Type-check (tsc, every package and the app)
        run: pnpm typecheck

      - name: Lint (eslint, 0 warnings)
        run: pnpm lint

      # Unit tests, from source — they need no build, so they run before it and fail faster. Today
      # this is the api-client's 59; `pnpm -r` picks up each package as it gains a `test` script.
      # ui#8 widens this lane into the component/coverage/a11y/e2e set the plan describes.
      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (packages, then the static export)
        run: pnpm build

      # `output: 'export'` is the whole deployment story, so assert the export actually happened
      # rather than trusting a zero exit code. A Next config change that quietly drops the export
      # would otherwise pass CI and only surface at deploy time.
      - name: The build produced a static export
        run: |
          test -f apps/console/out/index.html \
            || { echo "::error::next build produced no static export at apps/console/out/index.html"; exit 1; }
          echo "Static export present: $(find apps/console/out -type f | wc -l) files."

      # The first paint must arrive styled. AppRouterCacheProvider flushes Emotion's styles into the
      # prerendered HTML; without it the export ships unstyled markup and flashes on hydrate. That is
      # invisible to a type-check and to a passing build, so it is asserted on the emitted bytes.
      - name: The static export carries its styles (no flash on first paint)
        run: |
          grep -q 'data-emotion=' apps/console/out/index.html \
            || { echo "::error::apps/console/out/index.html carries no Emotion styles — the MUI cache provider is not wired, and the export will flash unstyled on first paint"; exit 1; }
          echo "Emotion styles are inlined in the prerendered HTML."

      # The third property that is invisible to a type-check, a passing build and a green jsdom
      # suite: the pre-paint script and the theme's CSS must key off the SAME attribute (ui#3).
      #
      # They are set in different files — `InitColorSchemeScript` in the app's root layout, the
      # selector in `packages/ui/src/theme.ts` — and neither can see the other. MUI's `"data"`
      # shorthand generates `[data-dark]` while the script writes `data-mui-color-scheme="dark"`;
      # everything still compiles, builds and tests green, and dark mode is dead in a browser. The
      # only place the disagreement is observable is the emitted bytes, so that is where it is
      # checked. jsdom cannot stand in for this: it does not populate the inline script's body.
      - name: The colour scheme applies before first paint (script and CSS agree)
        run: |
          grep -q 'data-mui-color-scheme' apps/console/out/index.html \
            || { echo "::error::apps/console/out/index.html carries no colour-scheme init script — the export will paint light for everyone and flip on hydrate"; exit 1; }
          grep -q '\[data-mui-color-scheme="dark"\]' apps/console/out/index.html \
            || { echo "::error::the dark colour scheme's CSS is not keyed to data-mui-color-scheme — theme.ts's colorSchemeSelector and InitColorSchemeScript's attribute disagree, and dark mode will never apply"; exit 1; }
          echo "The init script and the dark scheme's CSS agree on data-mui-color-scheme."

      # The fourth property invisible to everything else: every route must actually prerender its own
      # content (ui#5).
      #
      # `useSearchParams` opts its whole subtree out of prerendering, and identity lives in the query
      # string (ui.md §5.1), so most pages here will reach for it. Called too high in a page, it
      # empties that page out of the export — the HTML ships with the shell and nothing else, and the
      # content appears only once JavaScript has run. Every lane stays green: it type-checks, it
      # builds, the route is listed as static, and jsdom sees a fully rendered component because
      # jsdom does not prerender at all.
      #
      # A page's `<h1>` is the cheapest thing that proves the page itself was rendered. This caught
      # exactly one regression on the day it was written: the placeholder read its params at the top
      # level, and all twenty routes exported an empty content region.
      - name: Every route prerenders its own content
        run: |
          empty=""
          while IFS= read -r page; do
            grep -qE '<h1[^>]*>[^<]' "$page" || empty="$empty $page"
          done < <(find apps/console/out -name index.html)
          if [ -n "$empty" ]; then
            echo "::error::these routes exported no <h1>, so they prerender nothing and paint blank until hydration — a component is almost certainly calling useSearchParams above the content it needs it for (see shell/searchParams.ts):$empty"
            exit 1
          fi
          echo "All $(find apps/console/out -name index.html | wc -l) routes prerender their own content."

      # Cesium is client-only and code-split, asserted on the emitted bytes (ui#6).
      #
      # Two properties, both invisible everywhere else. The export must **serve Cesium's runtime
      # assets itself** — Cesium fetches its workers and web assembly from CESIUM_BASE_URL rather
      # than through the bundler, so a missing staging step is not a build error, it is a globe that
      # silently fails to load in a deployment nobody can debug from here (CX-LOCAL).
      #
      # And the 4 MB Cesium chunk must be reachable **only at runtime**: `next/dynamic` with
      # `ssr: false` is what keeps it out of every route's preload set, and a page that imported the
      # globe statically would put it in the first paint of routes that never draw one. The build
      # still succeeds either way, which is why this is checked here and not there.
      - name: Cesium is served locally and loaded only on demand
        run: |
          for dir in Assets ThirdParty Widgets Workers; do
            test -d "apps/console/out/cesium/$dir" \
              || { echo "::error::apps/console/out/cesium/$dir is missing — Cesium's runtime assets were not staged into the export, and the globe will fail to load with no build error to show for it"; exit 1; }
          done
          chunks=apps/console/out/_next/static/chunks
          biggest=$(ls -S "$chunks" | head -1)
          grep -q 'CESIUM_BASE_URL' "$chunks/$biggest" \
            || { echo "::error::the largest chunk is not Cesium's — this assertion has lost its subject and needs rewriting"; exit 1; }
          if grep -rl "$biggest" apps/console/out --include='*.html' >/dev/null 2>&1; then
            echo "::error::the Cesium chunk ($biggest) is preloaded by a prerendered route — something imports @astro-mine/view statically instead of through next/dynamic with ssr:false, and every route now pays 4 MB for a globe it does not draw"
            exit 1
          fi
          echo "Cesium staged locally ($(du -sh apps/console/out/cesium | cut -f1)); its chunk is runtime-only."
