name: CI

# The floor that must never be red. It runs on pull requests, not only on pushes to main — a gate
# that first speaks after a merge is a gate that speaks too late.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` as well as the defaults, so the `journeys` label *does something when applied*. The
    # opt-in lane below is gated on it, and GitHub's default pull-request trigger is
    # opened/synchronize/reopened — without this, labelling a pull request schedules nothing and the
    # lane silently waits for the next push, which reads as the label being ignored.
    types: [opened, synchronize, reopened, labeled]
  # Re-run `main` on demand. Every lane here failed for the first eight months of this repository's
  # life without executing a step -- the org was over its Actions minutes, so each job was refused
  # in three seconds with no log to read. `gh run rerun` will not restart a run that never started,
  # so once Actions came back there was no way to ask "is main actually green?" short of pushing a
  # commit to find out. This is that way.
  workflow_dispatch:

# Read-only by default (org security baseline).
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ONE JOB PER LANE (ui#8).
#
# This was a single `build` job with twenty-one steps. It was correct and it read badly: a red
# check said "build", and finding out whether that meant a type error, a contract drift or a
# colour-contrast regression meant opening the log. `ui#8`'s acceptance criterion is that "the lanes
# run on pull requests and **each names itself in the checks list**".
#
# The cost is honest and worth stating: each job installs the workspace again, about a minute, and
# they run in parallel so the wall clock is the slowest lane rather than the sum. What is NOT
# duplicated is the build — `build` runs it once and uploads the export, and the three lanes that
# need one download it. Rebuilding three times would have traded a legible failure for four minutes.

jobs:
  # ── the fast, static lanes ────────────────────────────────────────────────────────────────────
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The one rule this workspace exists to hold (ARCHITECTURE.md). First, because it is fast and
      # because a layering break makes every later failure harder to read.
      - name: Layering
        run: pnpm check:layering
      - name: No hand-written API types
        run: pnpm check:api-types

      # ...and the proof that each gate above can actually fail. A gate nothing has been observed to
      # reject is a gate nobody should trust.
      - name: Gate self-tests (every gate's companion)
        run: |
          pnpm check:layering:test
          pnpm check:api-types:test
          pnpm check:vocabularies:test
          pnpm check:api-drift:test
          pnpm check:bundle:test
          pnpm check:local-checkout:test
          pnpm check:chunks:test
          pnpm check:repair-escapes:test

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  # ── the cross-repository contracts ────────────────────────────────────────────────────────────
  #
  # Both read a private sibling repository with CORE_REPO_TOKEN, and both FAIL rather than skip when
  # the credential is absent: a compatibility check that goes quiet when its token lapses has stopped
  # existing, and it goes quiet on exactly the day nobody is looking.
  contract:
    name: Contract (API + platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The committed client is what the vendored document generates, and the vendored document is
      # what astro-mine-api serves at HEAD.
      - name: The client is in step with the API
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:api-drift

      # View vendors Core's units schema and conformance vectors; the inspector registry generates
      # Core's PluginKind and Hub's container kinds. Both go stale silently without a guard.
      - name: Vendored Core schemas are in step with the platform
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:core-schema
      - name: Core and Hub vocabularies are in step with the platform
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: pnpm check:vocabularies

  # ── the suite, with the floor ─────────────────────────────────────────────────────────────────
  unit:
    name: Unit & component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One Vitest over five projects, so the coverage floor is measured across the workspace rather
      # than five times independently. `--coverage` enforces the thresholds in vitest.config.ts.
      - name: Tests and coverage floor
        run: pnpm test:coverage

  # ── the design gates ──────────────────────────────────────────────────────────────────────────
  #
  # Their own lane rather than steps inside `unit`, because a failure here reads as what it is: a
  # contrast or colour-vision regression, not "a test broke". Each carries its own companion proving
  # it rejects a deliberately-bad pair.
  design:
    name: Contrast & colour vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contrast (WCAG 2.1 AA, light and dark)
        run: pnpm check:contrast
      - name: Colour-vision separation (categorical palette, light and dark)
        run: pnpm check:palette

  # ── the build, and the properties only the emitted bytes can show ─────────────────────────────
  build:
    name: Build & emitted bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (packages, then the static export)
        run: pnpm build

      # **Before anything else looks at the export, does it parse?** This lane asserted a great deal
      # about the emitted bytes and never that they were valid JavaScript — and for two waves they
      # were not: the minifier wrote an octal escape into a template literal, the 4 MB Cesium chunk
      # became a syntax error, and every 3D surface in the shipped bundle was dead with nothing red
      # to show for it (astro-mine-ui#55). A chunk that does not parse is a feature that never loads.
      - name: Every emitted chunk is parseable JavaScript
        run: pnpm check:chunks

      # `output: 'export'` is the whole deployment story, so assert the export happened rather than
      # trusting a zero exit code.
      - name: The build produced a static export
        run: |
          test -f apps/console/out/index.html \
            || { echo "::error::next build produced no static export at apps/console/out/index.html"; exit 1; }
          echo "Static export present: $(find apps/console/out -type f | wc -l) files."

      # The first paint must arrive styled. AppRouterCacheProvider flushes Emotion's styles into the
      # prerendered HTML; without it the export ships unstyled markup and flashes on hydrate. That is
      # invisible to a type-check and to a passing build.
      - name: The static export carries its styles (no flash on first paint)
        run: |
          grep -q 'data-emotion=' apps/console/out/index.html \
            || { echo "::error::apps/console/out/index.html carries no Emotion styles — the MUI cache provider is not wired, and the export will flash unstyled on first paint"; exit 1; }
          echo "Emotion styles are inlined in the prerendered HTML."

      # The pre-paint script and the theme's CSS must key off the SAME attribute. They are set in
      # different files and neither can see the other; everything compiles, builds and tests green,
      # and dark mode is dead in a browser. jsdom cannot stand in for it — it does not populate the
      # inline script's body — so the emitted bytes are where it is checked.
      - name: The colour scheme applies before first paint (script and CSS agree)
        run: |
          grep -q 'data-mui-color-scheme' apps/console/out/index.html \
            || { echo "::error::apps/console/out/index.html carries no colour-scheme init script — the export will paint light for everyone and flip on hydrate"; exit 1; }
          grep -q '\[data-mui-color-scheme="dark"\]' apps/console/out/index.html \
            || { echo "::error::the dark colour scheme's CSS is not keyed to data-mui-color-scheme — theme.ts's colorSchemeSelector and InitColorSchemeScript's attribute disagree, and dark mode will never apply"; exit 1; }
          echo "The init script and the dark scheme's CSS agree on data-mui-color-scheme."

      # `useSearchParams` called too high in a page empties that page out of the export — it ships
      # with the shell and nothing else, and every other lane stays green. A page's `<h1>` is the
      # cheapest thing that proves the page itself rendered.
      - name: Every route prerenders its own content
        run: |
          empty=""
          while IFS= read -r page; do
            grep -qE '<h1[^>]*>[^<]' "$page" || empty="$empty $page"
          done < <(find apps/console/out -name index.html)
          if [ -n "$empty" ]; then
            echo "::error::these routes exported no <h1>, so they prerender nothing and paint blank until hydration — a component is almost certainly calling useSearchParams above the content it needs it for (see shell/searchParams.ts):$empty"
            exit 1
          fi
          echo "All $(find apps/console/out -name index.html | wc -l) routes prerender their own content."

      # Cesium must be served by the deployment (it fetches workers and web assembly from
      # CESIUM_BASE_URL, not through the bundler) and must be reachable only at runtime.
      - name: Cesium is served locally and loaded only on demand
        run: |
          for dir in Assets ThirdParty Widgets Workers; do
            test -d "apps/console/out/cesium/$dir" \
              || { echo "::error::apps/console/out/cesium/$dir is missing — Cesium's runtime assets were not staged into the export, and the globe will fail to load with no build error to show for it"; exit 1; }
          done
          # The export redistributes CesiumJS and the 23 components its ThirdParty.json lists (14
          # MIT, 4 Apache-2.0, 3 ISC, 2 BSD-3-Clause). MIT and BSD-3-Clause require the notice to
          # ship with the bytes, so its absence is a licence failure, not a cosmetic one (ui#66).
          for f in LICENSE.md ThirdParty.json THIRD-PARTY-NOTICES.md; do
            test -s "apps/console/out/cesium/$f" \
              || { echo "::error::apps/console/out/cesium/$f is missing — the export would redistribute Cesium and its 23 bundled components with no notice of any kind, which MIT and BSD-3-Clause do not permit"; exit 1; }
          done
          chunks=apps/console/out/_next/static/chunks
          biggest=$(ls -S "$chunks" | head -1)
          grep -q 'CESIUM_BASE_URL' "$chunks/$biggest" \
            || { echo "::error::the largest chunk is not Cesium's — this assertion has lost its subject and needs rewriting"; exit 1; }
          if grep -rl "$biggest" apps/console/out --include='*.html' >/dev/null 2>&1; then
            echo "::error::the Cesium chunk ($biggest) is preloaded by a prerendered route — something imports @astro-mine/view statically instead of through next/dynamic with ssr:false, and every route now pays 4 MB for a globe it does not draw"
            exit 1
          fi
          echo "Cesium staged locally ($(du -sh apps/console/out/cesium | cut -f1)); its chunk is runtime-only."

      # ui#13: "The replay chunk is **not** in the leaderboard route's bundle, asserted against the
      # build output." The step above proves no *prerendered* route preloads Cesium; this one names
      # the route the criterion is about, because that is the one with a person behind it — a
      # student who opened a leaderboard to look at a number must not download a globe and an MCAP
      # reader to do it.
      #
      # Asserted on the referenced scripts rather than on a chunk name, because chunk names are
      # content hashes and change every build.
      # ui#17 asks the same of the candidate-inspection pane. Both heavy panes go through
      # `next/dynamic` and both are checked the same way, so the route list below covers the two of
      # them: `/design/study` mounts the inspection pane and `/bench/submission` mounts the replay,
      # and neither chunk may reach a route that draws no globe.
      - name: The replay viewer is absent from the routes that do not draw one
        run: |
          for route in bench/leaderboard registry compute design design/new help; do
            page="apps/console/out/$route/index.html"
            test -f "$page" || { echo "::error::$page is missing — this assertion has lost its subject"; exit 1; }
            for script in $(grep -o '/_next/static/[^"'"'"']*\.js' "$page" | sort -u); do
              file="apps/console/out${script}"
              test -f "$file" || continue
              if grep -q 'CESIUM_BASE_URL\|@mcap/core\|McapIndexedReader' "$file"; then
                echo "::error::/$route references $script, which carries a 3D viewer. Something imports @astro-mine/view, ./ReplayScene or ./InspectionScene statically instead of through next/dynamic — see components/bench/ReplayPane.tsx and components/design/InspectionPane.tsx."
                exit 1
              fi
            done
          done
          echo "The 3D viewers are loaded on demand only; no route that draws no globe references one."

      # Built once, used by three lanes. `include-hidden-files` matters: the export has none today,
      # but the default silently drops dotfiles and a missing one would surface as a mystery 404.
      #
      # The artifact actions are the one pair here that is genuinely exercised rather than merely
      # present — `bundle`, `e2e`, `a11y` and `journeys` all download what this uploads, so a major
      # bump that broke the handoff would take four lanes with it rather than passing quietly.
      - name: Upload the export
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: apps/console/out
          include-hidden-files: true
          retention-days: 1

  # ── the lanes that need a built export ────────────────────────────────────────────────────────
  bundle:
    name: Bundle budget
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: static-export
          path: apps/console/out
      - name: Per-route JavaScript is within budget
        run: pnpm check:bundle

  e2e:
    name: E2E (built export)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: static-export
          path: apps/console/out

      # `--with-deps` is what this workspace's own development environment cannot have: Chromium
      # needs system libraries (libasound2 among them) that a WSL checkout does not ship, which is
      # why a red browser lane *there* is environmental and why this job is the arbiter.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The `degraded` project: the smoke floor and — since ui#20 — the degraded journey, which
      # asserts that with **no API configured at all** every route renders, keeps its navigation and
      # names the missing backend with a remedy. It needs no Python and no seed, which is why it is
      # a separate lane from `journeys` below rather than a phase of it.
      - name: Smoke and the degraded journey
        # Named specs rather than the whole project: `pnpm e2e` also sweeps axe, which is the `a11y`
        # job's work and runs there in parallel. Locally the bare command is the right default —
        # one command, the whole browser lane — and here it would just be the same minutes twice.
        #
        # The scripts spell it `--project=degraded`, not `--project degraded`, and that is what makes
        # passing files here work at all: `--project` takes a *list*, so with a space the paths
        # append to it and Playwright reports `Project(s) "e2e/smoke.spec.ts" not found`. Caught by
        # this lane on its first run, which is the argument for the lane.
        #
        # `deployment.spec.ts` joins them because it needs the same thing and nothing more: one
        # served export, no API. It fulfils `config.json` at the network layer, which is what lets
        # the *same build* be driven at two different endpoints in one run — the proof that changing
        # the API URL is a file edit rather than a rebuild (ui#21).
        run: pnpm e2e e2e/smoke.spec.ts e2e/degraded.spec.ts e2e/deployment.spec.ts

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  a11y:
    name: Accessibility (routes, both schemes)
    needs: build
    runs-on: ubuntu-latest
    # **A GATE, since ui#20.** `ui#8` shipped this lane with `continue-on-error: true` and a note
    # saying Wave 30 would remove the line once there were real pages behind the routes and any
    # finding had been fixed rather than baselined. Both happened: Wave 29 built the pages, and the
    # sweep is clean across every route in both colour schemes — so the line is gone.
    #
    # There is deliberately no allowlist and no baseline file. An accessibility claim with an
    # exceptions list is a claim about the exceptions; the moment one violation is tolerated, the
    # lane's answer stops being yes-or-no and starts needing interpretation.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: static-export
          path: apps/console/out
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # A real browser, so `color-contrast` can actually run — the rule the jsdom lane must disable
      # because it samples pixels and jsdom has no paint engine.
      - name: axe over every route, light and dark
        run: pnpm e2e:a11y

  # ── the image, executed rather than read ──────────────────────────────────────────────────────
  #
  # **The only lane that proves a deployment.** Every other lane here drives `apps/console/out`
  # through a static server this repository configures for itself, which proves the *bundle* works
  # and says nothing about the artifact an operator actually runs. The image adds the one thing the
  # bundle cannot do for itself — put `config.json` in place at container start — and a nginx
  # configuration that only ever gets read is a nginx configuration that is wrong.
  #
  # It does not `needs: build`: the image builds the export itself, from source, in its own first
  # stage. Reusing the uploaded artifact would make the image a wrapper around this workflow rather
  # than something a person can `docker build` from a clean clone, which is the property being
  # claimed. The cost is one more `pnpm install` and `next build`, in parallel with everything else.
  #
  # **Nothing is pushed anywhere.** This workspace publishes nothing during incubation (see
  # README.md → "What this workspace publishes"), and an image with no consumer and no registry is
  # an image that only has to be correct. Adding a release lane is a deliberate change on the day
  # there is somewhere for it to go.
  image:
    name: Image (builds, serves, configures)
    runs-on: ubuntu-latest
    # A bound rather than the six-hour default: this job compiles a front end inside a container,
    # and a hung build should not hold a runner for an afternoon. Generous against the observed cost.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Plain `docker build` rather than a build-push action: there is nothing to push, and a
      # registry-cache round trip would cost about what it saves on a job this size. BuildKit is
      # the runner's default.
      - name: Build the image
        run: docker build -t astro-mine-ui:ci .

      # A container that is up is not a container that is serving. Every assertion below runs
      # against a server that has answered once — and `wait-for-container.sh` prints the container's
      # status and logs when it does not, which is the difference between a diagnosis and a bisect.
      - name: Start it unconfigured
        run: |
          docker run -d --name unconfigured -p 8080:8080 astro-mine-ui:ci
          bash .github/scripts/wait-for-container.sh unconfigured http://127.0.0.1:8080/

      # The state a reader meets when nobody has configured a backend. `ui.md` §7 rule 3 is asserted
      # on the pages by the degraded lane; what this asserts is that the *image* produces that state
      # rather than a crash loop or a baked-in endpoint.
      - name: With no endpoint set, it serves the export and no config
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/config.json)
          [ "$code" = "404" ] \
            || { echo "::error::/config.json answered $code on an unconfigured container; it must be absent, which is what the application reads as 'no API is configured'"; exit 1; }

          curl -fsS http://127.0.0.1:8080/ | grep -q '<h1' \
            || { echo "::error::/ served no <h1> — the export is not being served"; exit 1; }

          # `trailingSlash: true` emits a directory per route. Both forms must work: a shared link
          # carries whichever one the reader copied.
          for path in /bench/leaderboard/ /bench/leaderboard /registry/artifact/; do
            curl -fsS "http://127.0.0.1:8080$path" | grep -q '<h1' \
              || { echo "::error::$path did not serve the page"; exit 1; }
          done

          # A mistyped URL gets the application's own not-found page, on a 404 status. A static host
          # that answered every path with index.html would make a broken link look like a working
          # one — which is why this asserts the code and the body together.
          code=$(curl -s -o /tmp/nf.html -w '%{http_code}' http://127.0.0.1:8080/no/such/page)
          [ "$code" = "404" ] || { echo "::error::an unknown path answered $code, not 404"; exit 1; }
          grep -q '<h1' /tmp/nf.html \
            || { echo "::error::the 404 body is not the application's own not-found page"; exit 1; }

      # Cesium is served by the deployment or the globe does not load. The build lane asserts the
      # files were staged; this asserts nginx hands them over, with the content type a browser will
      # instantiate WebAssembly from.
      #
      # **The filenames are read out of the image, not written down here.** Cesium's workers are
      # emitted as content-hashed chunks — `chunk-2AIOP76V.js` — so a name written into this file is
      # a name that stops existing at the next bump. Written down, it failed on this step's very
      # first run against a name from an older layout; the assertion would then have been "fixed" by
      # pasting in today's hash, which is the same bug with a longer fuse.
      - name: Cesium is served by the deployment, correctly typed and cached
        run: |
          probe() {
            docker run --rm --entrypoint sh astro-mine-ui:ci -c \
              "ls /usr/share/nginx/html/cesium/$1 | head -1"
          }
          worker=$(probe 'Workers/*.js')
          wasm=$(probe 'ThirdParty/*.wasm')
          test -n "$worker" && test -n "$wasm" \
            || { echo "::error::the image stages no Cesium workers or WebAssembly at all"; exit 1; }
          worker=$(basename "$worker"); wasm=$(basename "$wasm")
          echo "Probing Workers/$worker and ThirdParty/$wasm."

          ct=$(curl -fsS -o /dev/null -w '%{content_type}' \
            "http://127.0.0.1:8080/cesium/ThirdParty/$wasm")
          case "$ct" in
            application/wasm*) ;;
            *) echo "::error::$wasm was served as '$ct'; a browser refuses to stream-compile anything but application/wasm"; exit 1 ;;
          esac
          curl -fsS -o /dev/null "http://127.0.0.1:8080/cesium/Workers/$worker" \
            || { echo "::error::Cesium's workers are not served"; exit 1; }

          curl -fsS -D- -o /dev/null "http://127.0.0.1:8080/cesium/ThirdParty/$wasm" \
            | grep -qi 'cache-control:.*immutable' \
            || { echo "::error::content-addressed assets are not served immutable"; exit 1; }

      # `add_header` does not accumulate across nginx levels — a location that sets Cache-Control
      # discards every header inherited from the server block. That footgun is invisible until
      # somebody looks at a response, so this looks at responses from three different locations.
      - name: The security headers survive every location block
        run: |
          for path in / /cesium/ThirdParty/draco_decoder.wasm /no/such/page; do
            curl -s -D- -o /dev/null "http://127.0.0.1:8080$path" \
              | grep -qi 'x-content-type-options: nosniff' \
              || { echo "::error::$path answered without X-Content-Type-Options; a location block dropped the inherited headers"; exit 1; }
          done

      - name: Stop the unconfigured container
        if: always()
        run: docker rm -f unconfigured

      # THE CLAIM THE IMAGE EXISTS FOR: one build, two deployments, no rebuild between them.
      # Same image id, two `docker run` invocations, two endpoints.
      - name: The endpoint arrives at container start, not at build time
        run: |
          for endpoint in https://alpha.example https://beta.example; do
            docker run -d --name cfg -p 8081:8080 -e "ASTRO_MINE_API_BASE_URL=$endpoint" astro-mine-ui:ci
            bash .github/scripts/wait-for-container.sh cfg http://127.0.0.1:8081/ \
              || { docker rm -f cfg; exit 1; }

            body=$(curl -fsS http://127.0.0.1:8081/config.json)
            [ "$body" = "{\"apiBaseUrl\":\"$endpoint\"}" ] \
              || { echo "::error::config.json is '$body', expected {\"apiBaseUrl\":\"$endpoint\"}"; docker logs cfg; docker rm -f cfg; exit 1; }

            # Never cached: it is the one file that differs between two deployments of identical
            # bytes, and a cached copy would pin a bundle to whichever backend it first met.
            curl -s -D- -o /dev/null http://127.0.0.1:8081/config.json | grep -qi 'cache-control:.*no-store' \
              || { echo "::error::config.json is cacheable"; docker rm -f cfg; exit 1; }

            docker rm -f cfg
          done
          echo "One image, two endpoints, no rebuild."

      # A mounted file is a deliberate act — a ConfigMap, a compose volume, an operator who wants
      # more in it than one key. An entrypoint that overwrote it would make the mount silently do
      # nothing, which is the worst of the three outcomes.
      - name: A mounted config.json is left alone
        run: |
          echo '{"apiBaseUrl":"https://mounted.example"}' > /tmp/config.json
          docker run -d --name mounted -p 8082:8080 \
            -e ASTRO_MINE_API_BASE_URL=https://env.example \
            -v /tmp/config.json:/usr/share/nginx/html/config.json:ro astro-mine-ui:ci
          bash .github/scripts/wait-for-container.sh mounted http://127.0.0.1:8082/ \
            || { docker rm -f mounted; exit 1; }
          body=$(curl -fsS http://127.0.0.1:8082/config.json)
          docker rm -f mounted
          case "$body" in
            *mounted.example*) echo "The mounted file won, as it must." ;;
            *) echo "::error::the entrypoint overwrote a mounted config.json with the environment variable: $body"; exit 1 ;;
          esac

      # An operator who set the variable meant to configure this deployment. Serving the
      # unconfigured state instead would hide their typo behind a page that reads like a design
      # decision, so a malformed value fails at start, where the message reaches the person who
      # typed it.
      - name: A malformed endpoint fails the container rather than degrading quietly
        run: |
          if docker run --rm --name bad -e ASTRO_MINE_API_BASE_URL=not-a-url astro-mine-ui:ci; then
            echo "::error::the container started with ASTRO_MINE_API_BASE_URL=not-a-url; a typo would serve as 'no API is configured' forever"
            exit 1
          fi
          echo "Rejected at start, as it must be."

      - name: The image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id astro-mine-ui:ci -u)
          [ "$uid" != "0" ] \
            || { echo "::error::the image runs as root; nginx-unprivileged is the base precisely so it does not"; exit 1; }
          echo "Runs as uid $uid."

  # ── the persona journeys, against a real seeded API ───────────────────────────────────────────
  #
  # **The only lane in this repository that proves the contract holds.** Every other test that
  # touches the API drives a fake generated from the same OpenAPI document as the client, so the two
  # cannot disagree — which is exactly why they also cannot catch a route that does not exist, a
  # deployment that mounts nothing, or a response the document describes and the service never
  # sends. This one brings up `astro-mine-api` for real, seeds it, and drives each persona journey
  # through the browser.
  #
  # **It runs on `main`, and on a pull request only when labelled `journeys`.** The cost is honest:
  # it installs the platform from git, which is a maturin build plus torch, ortools and usd-core, so
  # it is minutes rather than seconds even with uv's cache warm. That is a real trade — a journey
  # can break on a pull request and only speak after merge — and it is why the label exists: any
  # change that touches a page, the client or the API contract should carry it.
  journeys:
    name: Persona journeys (seeded API)
    needs: build
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'journeys')
    runs-on: ubuntu-latest
    # A bound, because this lane can wait on a real backend and a real evaluator. Without it the job
    # inherits GitHub's 360-minute default, so a submission that never returns holds a runner for six
    # hours. Generous against the observed cost — the whole job is ~3 minutes, most of it installing
    # the platform — and still far short of a wasted afternoon.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The API tier, at its default branch. Not a pin: the front end vendors the API's OpenAPI
      # snapshot and a separate lane already fails on drift, so the question this lane answers is
      # "does the application work against the API as it is now", and a pinned checkout would answer
      # a different one. CORE_REPO_TOKEN because it is private during incubation.
      - name: Check out astro-mine-api
        uses: actions/checkout@v7
        with:
          repository: astro-mine/astro-mine-api
          path: .api
          token: ${{ secrets.CORE_REPO_TOKEN }}
          # hatch-vcs derives the version from git history; a shallow clone has none.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # astro-mine-platform is a private repo pinned as a uv git source; rewrite HTTPS GitHub
      # fetches so `uv sync` can resolve it.
      - name: Authenticate to private dependencies
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # NOT `--locked`, and `-U` on the one floating source: astro-mine-api deliberately tracks the
      # platform's `main` (api.md §7), so this resolves the platform commit that is current.
      - name: Install the API and the platform
        working-directory: .api
        run: uv sync --upgrade-package astro-mine-platform

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: static-export
          path: apps/console/out

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `scripts/journeys-up.mjs` seeds, serves the JWKS and runs uvicorn; Playwright starts it as a
      # webServer and waits for /healthz. The seed root defaults to the runner's temp directory,
      # which matters: Bench scores a submission in a Landlock-confined subprocess, and the
      # confinement needs a filesystem that honours it.
      - name: Drive each persona journey
        env:
          ASTRO_MINE_API_REPO: ${{ github.workspace }}/.api
          ASTRO_MINE_PYTHON: ${{ github.workspace }}/.api/.venv/bin/python
        run: pnpm e2e:journeys

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-journeys
          path: playwright-report
          retention-days: 7
