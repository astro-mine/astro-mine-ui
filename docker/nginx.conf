# The static host, inside the image (ui#21; ui.md §5.1, §8).
#
# Installed as `/etc/nginx/conf.d/default.conf`, replacing the base image's. It serves
# `apps/console/out` exactly as a plain static host would — no rewrites, no SPA fallback, no
# application server — because that is the deployment the browser lane drives and the one the
# design commits to. If a route needs a rewrite rule to work, it is broken on an object store too.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Redirects are emitted relative. nginx would otherwise build an absolute URL from `server_name`
    # and the listening port — `http://_:8080/bench/` behind any ingress that terminates TLS or maps
    # a port, which is every real deployment.
    absolute_redirect off;

    # The export carries no user content and sets no cookie, so there is nothing here for a
    # dictionary attack on compressed responses to learn.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm image/svg+xml application/manifest+json;

    # Nothing about the deployment's software version belongs in a response header.
    server_tokens off;

    # **`add_header` does not accumulate across levels.** A directive in a `location` discards every
    # one inherited from `server`, so the security headers cannot be declared once at the top —
    # each block that sets `Cache-Control` has to re-include them. That is nginx's rule, not a
    # preference, and forgetting it is how a `nosniff` header silently disappears from exactly the
    # responses that carry executable content. One file, included four times.
    include /etc/nginx/astro-mine-headers.conf;

    # ── the deployment's own configuration ────────────────────────────────────────────────────
    #
    # Written at container start by `/docker-entrypoint.d/10-runtime-config.sh`, or mounted. Never
    # cached: it is the one file that differs between two deployments of identical bytes, and a
    # cached copy would pin a bundle to whichever backend it first met.
    #
    # Absent is a normal state — a 404 here is what the application reads as "unconfigured", and it
    # says so with a remedy (`ui.md` §7 rule 3). There is deliberately no fallback to
    # `config.example.json`: an example endpoint served as the real one is precisely the stand-in
    # that looks like the real thing.
    location = /config.json {
        include /etc/nginx/astro-mine-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # ── immutable build output ────────────────────────────────────────────────────────────────
    #
    # Next names these by content hash, and Cesium's are staged from a pinned version, so a changed
    # file is a changed URL. A year is the maximum the spec allows and the correct answer for a
    # name that cannot mean two things.
    location /_next/static/ {
        include /etc/nginx/astro-mine-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /cesium/ {
        include /etc/nginx/astro-mine-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── the pages ─────────────────────────────────────────────────────────────────────────────
    #
    # `no-cache` means "revalidate", not "do not store": a redeployed bundle has to be picked up on
    # the next visit, and an HTML document cached for a day would keep a reader on the previous
    # release while every hashed asset it references had moved.
    #
    # `$uri/` is what serves `/bench` from `bench/index.html` — `trailingSlash: true` emits a
    # directory per route, and nginx resolves the directory internally rather than bouncing the
    # browser through a redirect.
    location / {
        include /etc/nginx/astro-mine-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # An unmatched URL gets the application's own not-found page — with its navigation — rather
    # than nginx's default, so a mistyped link does not drop a reader out of the application. This
    # is a 404 body on a 404 status, never a 200: a static host that answered every path with
    # `index.html` would make a broken link indistinguishable from a working one.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/astro-mine-headers.conf;
        internal;
    }
}
