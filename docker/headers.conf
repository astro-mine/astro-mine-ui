# The response headers every location sets (ui#21).
#
# Included rather than declared once at `server` level because `add_header` **replaces** the
# inherited set the moment a location declares one of its own — see the note in `nginx.conf`. This
# file is the single definition; the repetition is four `include` lines, not four copies.
#
# **What is deliberately not here: a Content-Security-Policy.** A useful `connect-src` would have to
# name the API, and the API is runtime configuration — not known when this file is written. Worse,
# two of the things the application legitimately loads are addresses the *API supplies*: an
# episode's MCAP replay and a world's 3D Tiles bundle can live on a registry or an object store
# beside the API rather than on it. A policy tight enough to be worth having would break replay for
# any deployment that does that, and a policy loose enough to be safe would assert nothing. The
# claim this repository does make — that the *bundle* fetches nothing off-origin of its own accord,
# no CDN, no font host, no analytics — is asserted where it can be checked rather than declared:
# `e2e/deployment.spec.ts` records every request each route makes. REVISIT when the deployment
# topology is fixed enough for the policy to be generated at container start alongside `config.json`.

# The export serves JavaScript, JSON and WebAssembly. A sniffed content type on any of those is the
# one that turns an upload into a script.
add_header X-Content-Type-Options "nosniff" always;

# The application is never framed, and nothing in it is meant to be embedded elsewhere.
add_header X-Frame-Options "DENY" always;

# The browser's own default already withholds the path cross-origin; this withholds the origin too.
# Nothing the application talks to uses `Referer` — the API authenticates with a bearer token — so
# there is no cost to sending none.
add_header Referrer-Policy "no-referrer" always;

# The console draws maps and charts. It has never asked for a camera, a microphone or a location,
# and a page that starts asking should have to change this line to do it.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
